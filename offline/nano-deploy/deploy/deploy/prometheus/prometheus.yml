global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: yoox-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:9000]

  - job_name: yoox-media
    static_configs:
      - targets: [mediamtx:9998]

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
