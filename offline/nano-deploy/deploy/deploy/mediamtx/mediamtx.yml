logLevel: info
logDestinations: [stdout]

api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998
pprof: false
playback: false

# 设备经 NAT 推流时码流会抖动，默认 10s 读超时会误断推流会话。
readTimeout: 60s
writeTimeout: 60s
writeQueueSize: 2048

authMethod: internal
authInternalUsers:
  - user: yoox-publisher
    pass: yoox_rtsp_local_dev
    ips: []
    permissions:
      - action: publish
        path:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
  - user: any
    pass:
    ips: ["172.16.0.0/12"]
    permissions:
      - action: metrics

# RTSP 传输协议由 compose 的 MTX_RTSPTRANSPORTS 环境变量控制（对应 .env 的
# YOOX_RTSP_TRANSPORTS）。Linux 主机（如 Jetson Nano）默认 udp,tcp：优先低延迟
# UDP，UDP 不通时自动回退 TCP 交织（RTP over TCP）。Mac/Docker Desktop 因 UDP
# 端口转发不可靠必须改为 tcp。下面的值仅在未设置该环境变量时生效。
rtsp: true
rtspAddress: :8554
rtspTransports: [udp, tcp]
# RTSP UDP 传输的服务端 RTP/RTCP 端口。默认 8000/8001 会与 WebRTC 的
# webrtcLocalUDPAddress(:8000) 冲突，改用 8188/8189，并由 compose 以相同端口号
# 映射到宿主（UDP 端口映射要求宿主与容器端口一致）。
rtpAddress: :8188
rtcpAddress: :8189
rtmp: false
rtmpAddress: :1935
hls: true
hlsAddress: :8888
hlsAlwaysRemux: false
hlsVariant: lowLatency
srt: false
moq: false

# Web browsers cannot play RTSP directly. WHEP is enabled only as the browser
# playback egress generated from the RTSP source.
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcLocalUDPAddress: :8000
# Keep a TCP ICE candidate on the same port for networks that block UDP.
webrtcLocalTCPAddress: :8000
webrtcIPsFromInterfaces: true

pathDefaults:
  source: publisher
  # Allow a new authenticated publisher to replace a stale zero-RTP session.
  overridePublisher: true

paths:
  all_others:
