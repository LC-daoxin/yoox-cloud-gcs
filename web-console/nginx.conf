map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2048m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # A PMTiles reader requests byte ranges, never the whole national archive.
    # Keep package bytes unchanged; missing assets must not return the SPA.
    location = /maps/current.json {
        alias /srv/maps/current.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location ^~ /maps/releases/ {
        alias /srv/maps/releases/;
        gzip off;
        max_ranges 1;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        types {
            application/json json;
            application/octet-stream pmtiles pbf;
            image/png png;
            font/otf otf;
            text/plain txt;
        }
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    location /api/v1/ws {
        proxy_pass http://api:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(manage|map|media|wayline|storage|control|actuator|v3|swagger-ui)(/|$) {
        proxy_pass http://api:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Browser WHEP path: /webrtc/<stream>/whep -> MediaMTX /<stream>/whep
    location /webrtc/ {
        proxy_pass http://mediamtx:8889/;
        # MediaMTX returns a root-relative session Location. Keep DELETE/PATCH
        # on the same proxy prefix instead of sending them to the SPA fallback.
        proxy_redirect ~^(/.*)$ /webrtc$1;
        # Preserve the browser's external port (8080/9000), not container port 80.
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /mqtt {
        proxy_pass http://emqx:8083/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # index.html 不缓存，确保每次拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
