logLevel: info
logDestinations: [stdout]

api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998
pprof: false
playback: false

# 设备经 NAT 推流时码流会抖动，默认 10s 读超时会误断推流会话。
readTimeout: 60s
writeTimeout: 60s
writeQueueSize: 2048

authMethod: internal
authInternalUsers:
  - user: yoox-publisher
    pass: yoox_rtsp_local_dev
    ips: []
    permissions:
      - action: publish
        path:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
  - user: any
    pass:
    ips: ["172.16.0.0/12"]
    permissions:
      - action: metrics

# 设备经 Docker NAT 推流时 UDP 媒体包会丢失，强制 TCP 交织传输（RTP over TCP），
# 媒体数据与 RTSP 控制共用同一 TCP 连接，可靠穿越任意 NAT。
rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]
rtmp: false
rtmpAddress: :1935
hls: true
hlsAddress: :8888
hlsAlwaysRemux: false
hlsVariant: lowLatency
srt: false
moq: false

# Web browsers cannot play RTSP directly. WHEP is enabled only as the browser
# playback egress generated from the RTSP source.
webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcLocalUDPAddress: :8000
webrtcIPsFromInterfaces: true

pathDefaults:
  source: publisher
  overridePublisher: false

paths:
  all_others:
