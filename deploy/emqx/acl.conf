%% YOOX service and device MQTT authorizations.
%% DRC browser/device temporary rules are resolved from Redis before this file.

{allow, {username, "yoox-cloud"}, all, ["#"]}.
{allow, {username, "yoox-device"}, publish, ["sys/#", "thing/#"]}.
{allow, {username, "yoox-device"}, subscribe, ["sys/#", "thing/#"]}.
{allow, {username, "pilot"}, publish, ["sys/#", "thing/#"]}.
{allow, {username, "pilot"}, subscribe, ["sys/#", "thing/#"]}.
{deny, all}.
